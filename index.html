<!doctype html>
<!-- Plan (tasteskill 2.5.1)
     1 kind: service (a person who is hired: a developer's portfolio). page type service, site-kind other.
     2 deal: palette stone-blueprint (light theme, as dealt) with its dark twin as the default theme the brief asks for:
       warm stone neutrals and one blueprint blue, a working drawing's colours for someone who builds software.
       type hanken (Hanken Grotesk); hero split (the profile photograph on the right); nav-mega as plain words (nothing to
       put in a panel); close-type (close-photo redealt: no second photograph); footer-columns (footer-visit redealt: no
       address); rhythm dark-band (moot on a dark page: none); buttons arrow; mark ring; moment word-highlight on the bio.
     sections: hero (name, tagline, photo, socials) / about + skills (statement, word-highlight) / projects (cards +
       detail dialog) / education + certifications / footer.closing (contact + footer). Every section but the hero and
       the footer hides itself while the database has no entries for it. -->
<html lang="en" data-type="service" data-radius="soft" data-buttons="arrow" data-motion data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- theme before the first paint: the saved choice, else the device setting, else dark -->
<script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})()</script>
<title>Andrew Benedict I. Alcantara: software projects, skills and contact</title>
<meta name="description" content="The work of Andrew Benedict I. Alcantara: projects with live demos and source code, the skills behind them, education and certifications.">
<meta property="og:type" content="website">
<meta property="og:title" content="Andrew Benedict I. Alcantara">
<meta property="og:description" content="Projects with live demos and source code, skills, education and certifications.">
<meta property="og:image" content="https://dr3wwww.github.io/share.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#141412" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#dfdedb" media="(prefers-color-scheme: light)">
<link rel="canonical" href="https://dr3wwww.github.io/">
<meta name="site-kind" content="other">
<meta name="page-type" content="service">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css">
<link rel="stylesheet" href="assets/ui/cards.css">
<link rel="stylesheet" href="assets/motion/motion.css">
<link rel="stylesheet" href="assets/layout/layout.css">
<link rel="stylesheet" href="assets/icons/icon.css">
<style>
:root {
  --p-bg: #dfdedb; --p-surface: #d3d2ce; --p-ink: #26251e; --p-muted: #5a5850;
  --p-accent: #2456d6; --p-accent-ink: #ffffff; --p-action: #2456d6; --p-action-ink: #ffffff;
  --p-inv-bg: #26251e; --p-inv-surface: #313029; --p-inv-ink: #dfdedb; --p-inv-muted: #9e9d99;
  --p-inv-accent: #dfdedb; --p-inv-accent-ink: #26251e; --p-inv-action: #dfdedb; --p-inv-action-ink: #26251e;
  --font-display: "Hanken Grotesk", system-ui, sans-serif;
  --font-text: "Hanken Grotesk", system-ui, sans-serif;
  --display-weight: 400;
  --display-tracking: -0.03em;
  --display-tracking-xl: -0.038em;
}
</style>
<link rel="stylesheet" href="css/site.css">
<script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
<script>document.documentElement.classList.add('mo-js');setTimeout(()=>document.documentElement.classList.add('mo-safe'),2500)</script>
<link rel="modulepreload" href="assets/moments/moments.js">
<link rel="modulepreload" href="assets/moments/lib.js">
<link rel="modulepreload" href="assets/moments/word-highlight/moment.js">
</head>
<body>
<header class="nav">
  <div class="wrap nav__bar">
    <a class="skip-link" href="#top">Skip to content</a>
    <a class="nav__logo" href="#top"><span class="mark" data-mark="ring" aria-hidden="true"></span><span data-bind="short-name">Andrew Alcantara</span></a>
    <nav class="nav__links" aria-label="Main" data-nav></nav>
    <div class="nav__actions" data-nav-action>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to light theme">
        <svg class="theme-toggle__sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <svg class="theme-toggle__moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <button class="nav__toggle" type="button" aria-expanded="false" aria-label="Menu"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 5h14M2 13h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </div>
</header>

<main id="top">
  <section class="hero hero--split" data-enter aria-labelledby="hero-h">
    <div class="wrap"><div class="hero-text grid hero__grid">
      <div class="hero__text span-5">
        <h1 id="hero-h" data-bind="name">Andrew Benedict I. Alcantara</h1>
        <p class="hero__lead" data-bind="tagline" hidden></p>
        <ul class="hero__socials socials-row" data-socials="hero" aria-label="Social links" hidden></ul>
        <div class="btn-row" data-hero-actions></div>
      </div>
      <div class="hero__media span-6 start-7" data-hero-media>
        <div class="monogram" aria-hidden="true"><span data-bind="initials">AA</span></div>
      </div>
    </div></div>
  </section>

  <section class="section statement" id="about" data-moment="word-highlight" aria-labelledby="about-h" hidden>
    <div class="wrap">
      <h2 class="t-label muted about__label" id="about-h">About</h2>
      <p class="mo-wh__text" data-bind="bio"></p>
      <div class="skills-block" id="skills" hidden>
        <p class="t-label muted">Skills</p>
        <div class="grid skills" data-list="skills"></div>
      </div>
    </div>
  </section>

  <section class="section" id="projects" aria-labelledby="projects-h" hidden>
    <div class="wrap">
      <div class="section-head"><h2 id="projects-h">Projects</h2></div>
      <div class="grid projects" data-list="projects"></div>
    </div>
  </section>

  <section class="section" id="background" aria-labelledby="background-h" hidden>
    <div class="wrap">
      <div class="section-head"><h2 id="background-h" data-bind="background-title">Education and certifications</h2></div>
      <div class="grid background">
        <div class="background__col" id="education" hidden>
          <p class="t-label muted">Education</p>
          <ul class="rows edu" data-list="education"></ul>
        </div>
        <div class="background__col" id="certifications" hidden>
          <p class="t-label muted">Certifications</p>
          <ul class="rows certs" data-list="certifications"></ul>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="footer closing" id="contact" aria-labelledby="close-h">
  <div class="wrap">
    <div class="closing__cta close--type" data-contact hidden>
      <div class="section-head">
        <h2 id="close-h">Get in touch</h2>
        <p data-contact-line></p>
      </div>
      <div data-contact-main></div>
      <ul class="socials-row socials-row--lg" data-socials="contact" aria-label="Social links"></ul>
    </div>
    <div class="closing__links">
      <div class="footer__legal">
        <span>&copy; <span data-year></span> <span data-bind="name">Andrew Benedict I. Alcantara</span></span>
        <a class="footer__top" href="#top">Back to top</a>
      </div>
    </div>
  </div>
</footer>

<dialog class="project-dialog" data-project-dialog aria-labelledby="pd-title">
  <div class="project-dialog__inner">
    <div class="project-dialog__head">
      <h2 id="pd-title" data-pd="title"></h2>
      <button class="icon-btn" type="button" data-pd-close aria-label="Close project details"><svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path d="M4 4l10 10M14 4 4 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    </div>
    <div class="project-dialog__gallery" data-pd="gallery"></div>
    <div class="project-dialog__body">
      <div class="project-dialog__text" data-pd="text"></div>
      <ul class="tags" data-pd="tags"></ul>
      <div class="btn-row" data-pd="links"></div>
    </div>
  </div>
</dialog>

<script type="module" src="js/site.js"></script>
</body>
</html>

<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script>(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})()</script>
<title>Admin · Portfolio</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div class="shell">
  <header class="bar">
    <a class="brand" href="../" title="View the live site"><span class="brand__mark" aria-hidden="true"></span>Portfolio admin</a>
    <div class="bar__right">
      <a class="btn btn--ghost" href="../" target="_blank" rel="noopener">View site</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch theme">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18z" fill="currentColor"/><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </button>
      <button class="btn btn--ghost" type="button" data-signout hidden>Sign out</button>
    </div>
  </header>

  <!-- shown when js/config.js still has the placeholders -->
  <section class="panel notice" data-view="setup" hidden>
    <h1>Connect Supabase first</h1>
    <p>This panel needs your Supabase project. Open <code>js/config.js</code>, paste your Project URL and anon public key, then reload. The steps are in <code>README.md</code>.</p>
  </section>

  <!-- sign in -->
  <section class="panel login" data-view="login" hidden>
    <h1>Sign in</h1>
    <p class="muted">Only the site owner can sign in here.</p>
    <form class="form" data-login novalidate>
      <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="username" required></div>
      <div class="field"><label for="l-pass">Password</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn btn--primary" type="submit">Sign in</button>
      <p class="form__status" role="status" data-login-status></p>
    </form>
  </section>

  <!-- the editor -->
  <div class="app" data-view="app" hidden>
    <nav class="tabs" aria-label="Content">
      <button type="button" class="tab" data-tab="profile" aria-current="true">Profile</button>
      <button type="button" class="tab" data-tab="social_links">Social links</button>
      <button type="button" class="tab" data-tab="skills">Skills</button>
      <button type="button" class="tab" data-tab="projects">Projects</button>
      <button type="button" class="tab" data-tab="education">Education</button>
      <button type="button" class="tab" data-tab="certifications">Certifications</button>
    </nav>
    <main class="content" data-content></main>
  </div>
</div>
<div class="toast" role="status" aria-live="polite" data-toast></div>
<script type="module" src="../js/admin.js"></script>
</body>
</html>
